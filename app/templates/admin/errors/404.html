{% extends "admin/base_admin.html" %}

{% block page_title %}Resource Not Found (404){% endblock %}

{% block content %}
<div class="admin-card" style="text-align: center; padding: var(--space-3xl) var(--space-xl);">
  <div style="font-family: var(--font-mono); font-size: 3rem; font-weight: 800; color: var(--color-accent); margin-bottom: var(--space-sm);">
    404
  </div>
  <h2 style="margin-bottom: var(--space-sm);">Admin Resource Not Found</h2>
  <p style="color: var(--color-text-muted); margin-bottom: var(--space-xl); max-width: 450px; margin-left: auto; margin-right: auto;">
    The requested administrative path or record ID does not exist in the CMS database.
  </p>
  <a href="/admin" class="btn btn-primary">Return to Admin Dashboard</a>
</div>
{% endblock %}
